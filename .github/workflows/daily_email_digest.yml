name: Email Daily Summer 2027 Digest

on:
  schedule:
    # Run at both possible 4:11 PM Eastern UTC offsets. The script sends only
    # during the 4 PM America/New_York hour, so daylight saving time is handled.
    - cron: "11 20 * * *"
    - cron: "11 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-summer-2027-email
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check email configuration
        id: email-config
        env:
          DIGEST_EMAIL_USERNAME: ${{ secrets.DIGEST_EMAIL_USERNAME }}
          DIGEST_EMAIL_APP_PASSWORD: ${{ secrets.DIGEST_EMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          if [ -n "$DIGEST_EMAIL_USERNAME" ] && [ -n "$DIGEST_EMAIL_APP_PASSWORD" ] && [ -n "$DIGEST_EMAIL_TO" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Email secrets are not configured yet; see EMAIL_DIGEST_SETUP.md."
          fi

      - name: Download the latest upstream listing database
        if: steps.email-config.outputs.configured == 'true'
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json \
            --output .github/scripts/listings.json

      - name: Send daily email
        if: steps.email-config.outputs.configured == 'true'
        env:
          DIGEST_EMAIL_USERNAME: ${{ secrets.DIGEST_EMAIL_USERNAME }}
          DIGEST_EMAIL_APP_PASSWORD: ${{ secrets.DIGEST_EMAIL_APP_PASSWORD }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/daily_email_digest.py --scheduled
          else
            python scripts/daily_email_digest.py
          fi
