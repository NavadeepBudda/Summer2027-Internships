name: Sync Summer 2027 Listings

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: upstream-listings-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download the latest upstream listing database
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/.github/scripts/listings.json \
            --output .github/scripts/listings.json

      - name: Validate listings and generate Summer 2027 READMEs
        run: |
          uv run main.py listings validate
          uv run main.py readme update

      - name: Commit updates
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/scripts/listings.json README.md README-Inactive.md README-Off-Season.md
          if git diff --cached --quiet; then
            echo "Listings are already current."
            exit 0
          fi
          git commit -m "Sync upstream listings and refresh Summer 2027"
          git push origin HEAD:dev
